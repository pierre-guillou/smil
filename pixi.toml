[workspace]
authors = ["Pierre Guillou <pierre.guillou@minesparis.psl.eu>"]
channels = ["conda-forge"]
description = "Simple Morphological Image Library"
name = "smil"
platforms = ["linux-64", "win-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]

[dependencies]
smil = { path = "." }

[package]
name = "smil"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "*"

[package.build.config]
extra-args = [
    "-DWRAP_PYTHON=ON",
    "-DBUILD_SHARED_LIBS=OFF",
]

[package.build-dependencies]
swig = ">=4.2,<5"

[package.host-dependencies]
python = ">=3.10,<4"
freetype = ">=2.14.1,<3"
libpng = ">=1.6.47,<2"
libtiff = ">=4.7.0,<5"
libjpeg-turbo = ">=3.1.0,<4"
libcurl = ">=8.14.0,<9"
zlib = ">=1.3.1,<2"
qwt = ">=6.3.0,<7"
numpy = "*"

[package.target.linux-64.host-dependencies]
libgl-devel = ">=1.7.0,<2"
