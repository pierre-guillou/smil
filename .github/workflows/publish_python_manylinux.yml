name: publish_python_manylinux

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/${{ matrix.image }}
    strategy:
      matrix:
        python: [
            "cp39-cp39",
          ]
        image: [
           manylinux_2_28_x86_64
        ]

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        dnf update -y
        dnf install -y \
          sudo \
          doxygen \
          freetype-devel \
          libpng-devel \
          libtiff-devel \
          libjpeg-turbo-devel \
          libcurl-devel \
          qwt-qt5-devel

    - name: Register the python version
      run: |
        echo "/opt/python/${{ matrix.python }}/bin" >> $GITHUB_PATH

    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: ${{env.PYTHON_VERSION}}
        activate-environment: true

    - name : Build the Python wheel
      run : |
        uv build --wheel

    - name : Fix Python wheel
      run : |
        uv pip install auditwheel
        auditwheel show dist/*.whl
        auditwheel repair dist/*.whl
        # TODO test repaired wheel
        echo "MY_PKG=$(ls dist/*.whl)" >> "$GITHUB_ENV"

    - uses: actions/upload-artifact@v6
      # Use specific artifact identifier for publishing all versions
      with:
        name: linux-python-package-${{ matrix.image }}
        path: ${{env.MY_PKG}}

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/${{ matrix.image }}
    strategy:
      matrix:
        # Python version
        python: [
          # Double quote for version is needed otherwise 3.10 => 3.1
            "cp39-cp39",
            "cp310-cp310",
            "cp311-cp311",
            "cp312-cp312",
            "cp313-cp313",
            "cp314-cp314"
          ]
        image: [
           manylinux_2_28_x86_64
        ]

    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v7
      with:
        name: linux-python-package-${{ matrix.image }}

    - name: Register the python version
      run: |
        echo "/opt/python/${{ matrix.python }}/bin" >> $GITHUB_PATH

    - name: Setup uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: ${{env.PYTHON_VERSION}}
        activate-environment: true

    - name: Install Python package
      run: |
        uv pip install "./$(ls *.whl)"

    - name: Test installed package
      run: |
        python -c "import smilPython as sp"

    - name: Test Python scripts
      run: |
        cp -r images/* doc/demos/python
        cd doc/demos/python/
        python base_graph.py
        python benchs.py
        python blob_measures.py
        python constrained_watershed.py
        python copy_crop.py
        python example-3D-image-rotate.py
        python example-areathreshold.py
        python example-asfclose.py
        python example-bresenham.py
        python example-default-se.py
        python example-distance-geodesic.py
        python example-gaussian-filter.py
        python example-horiz-convolve.py
        python example-imagefileinfo-print.py
        python example-inertia-matrix.py
        python example-intro-blobs.py
        python example-point-minus.py
        python example-read.py
        python example-readRAW.py
        python extinction_values.py
        python first-program.py
        python hit_or_miss.py
        python loop-input.py
        python loop-sleep.py
        python multichannel_operations.py
        python numpy_array.py
        python numpy_np2image.py
        python numpy_np2sp.py
        python numpy_sp2np2sp.py
        python numpy_sp2np.py
        python operators.py
        python skiz.py
        python thresholds.py
        python x_image_01.py
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
